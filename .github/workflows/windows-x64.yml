name: Build Zhenguojian Windows x64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up MinGW x64
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\msys64\mingw64\bin\gcc.exe')) {
            & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --needed --noconfirm mingw-w64-x86_64-gcc'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build full Windows package
        shell: pwsh
        run: python scripts/build_windows.py --all-sources
      - name: Record source revision
        shell: pwsh
        run: git rev-parse HEAD | Out-File dist/windows/SOURCE_COMMIT.txt -Encoding utf8
      - name: Install synthetic media tools
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress
      - name: Package playback smoke check
        continue-on-error: true
        shell: pwsh
        run: python scripts/smoke_windows.py --all-sources
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: build/windows-package-smoke.json
          if-no-files-found: ignore
