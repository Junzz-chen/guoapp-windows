name: Build Zhenguojian Windows x64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      GOPROXY: https://proxy.golang.org,direct
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Set up MinGW x64
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\msys64\mingw64\bin\gcc.exe')) {
            & 'C:\msys64\usr\bin\bash.exe' -lc 'pacman -S --needed --noconfirm mingw-w64-x86_64-gcc'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          'C:\msys64\mingw64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Refresh unavailable pinned media archive
        run: >-
          python -c "from pathlib import Path; p=Path('packages/media_kit_libs_windows_video/windows/CMakeLists.txt'); s=p.read_text(); s=s.replace('20260921','20261104').replace('e76a35ec95','46787be250').replace('361392d64a231830ac79d1c0f91ddb68c6a709accd282b2c87b13889d382fdec','5ae0aaa85b2e690e9c574a44e10a86f3d5fe4b406ef6dfa684f5ab25e6bf6306'); p.write_text(s)"
      - name: Resolve missing lockfile dependencies
        run: flutter pub get
      - name: Build full Windows package
        run: python scripts/build_windows.py --all-sources
      - name: Record build inputs
        shell: pwsh
        run: |
          git rev-parse HEAD | Out-File dist/windows/SOURCE_COMMIT.txt -Encoding utf8
          Copy-Item pubspec.lock dist/windows/pubspec.lock
          Copy-Item packages/media_kit_libs_windows_video/windows/CMakeLists.txt dist/windows/media-CMakeLists.txt
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-windows-x64
          path: dist/windows/*
          if-no-files-found: error
          retention-days: 14
      - name: Install synthetic media tools
        run: choco install ffmpeg --yes --no-progress
      - name: Package playback smoke check
        continue-on-error: true
        run: python scripts/smoke_windows.py --all-sources
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: build/windows-package-smoke.json
          if-no-files-found: ignore
